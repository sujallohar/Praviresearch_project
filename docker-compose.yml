services:
  # --------------------------------------------------------------------------
  # GovAsset 360 - Production Web Container
  # Hardened Nginx Alpine serving React 19 PWA under non-root user
  # --------------------------------------------------------------------------
  govasset-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: govasset-360-web
    image: govasset-360:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    networks:
      - govasset-net

networks:
  govasset-net:
    driver: bridge
