# GovAsset 360 Hardened Production Nginx Configuration
# Optimized for Non-Root Alpine Containers & OWASP Security Standards

server {
    listen 8080;
    listen [::]:8080;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Security: Suppress Nginx Version Signature
    server_tokens off;

    # -------------------------------------------------------------
    # OWASP Defense-in-Depth Security Headers
    # -------------------------------------------------------------
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), geolocation=(), microphone=()" always;

    # -------------------------------------------------------------
    # High-Performance Gzip Compression
    # -------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types 
        text/plain 
        text/css 
        text/xml 
        text/javascript 
        application/x-javascript 
        application/javascript 
        application/json 
        application/xml 
        image/svg+xml;
    gzip_disable "MSIE [1-6]\.";

    # -------------------------------------------------------------
    # Container Health Check Probe Endpoint
    # -------------------------------------------------------------
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    # -------------------------------------------------------------
    # Hashed Static Assets (1-Year Immutable Caching)
    # -------------------------------------------------------------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # -------------------------------------------------------------
    # Service Worker & Manifest (No-Cache for Instant PWA Updates)
    # -------------------------------------------------------------
    location ~* (sw\.js|manifest\.webmanifest|manifest\.json)$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # -------------------------------------------------------------
    # Single Page Application (SPA) Client Routing
    # -------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # Security: Deny Access to Hidden Files (e.g. .env, .git)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
