name: GovAsset 360 DevSecOps & Security Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  # -----------------------------------------------------------
  # Gate 1: AppSec & Secret Detection (Gitleaks + Dependency Audit)
  # -----------------------------------------------------------
  security-scan:
    name: 🛡️ AppSec Secret & Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Run Gitleaks Secret Detection
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Install Clean Dependencies
        run: npm ci

      - name: Software Supply Chain Audit (SCA)
        run: npm audit --audit-level=critical
        continue-on-error: true

  # -----------------------------------------------------------
  # Gate 2: Code Quality & Static Type Verification
  # -----------------------------------------------------------
  quality-gate:
    name: 🧪 Quality Gate & Static Typecheck
    runs-on: ubuntu-latest
    needs: security-scan
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Strict TypeScript Compilation Check
        run: npx tsc -b --noEmit

      - name: High-Performance Linter Audit (Oxlint)
        run: npx oxlint

  # -----------------------------------------------------------
  # Gate 3: Production Build & Artifact Verification
  # -----------------------------------------------------------
  build-and-verify:
    name: 📦 Production Build & Asset Integrity
    runs-on: ubuntu-latest
    needs: quality-gate
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Compile Optimized Production Bundle
        run: npm run build
        env:
          VITE_FIREBASE_PROJECT_ID: govasset-360

      - name: Verify Distribution Artifacts
        run: |
          test -f dist/index.html || exit 1
          echo "✅ Production artifacts verified successfully. Ready for deployment."

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: production-dist
          path: dist/
          retention-days: 7

  # -----------------------------------------------------------
  # Gate 4: Docker Multi-Stage Build & Container Security Verification
  # -----------------------------------------------------------
  docker-verify:
    name: 🐳 Docker Multi-Stage Build Verification
    runs-on: ubuntu-latest
    needs: build-and-verify
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Production Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: govasset-360:ci
          load: true

      - name: Test Container Health Check Probe
        run: |
          docker run -d --name test-govasset -p 8080:8080 govasset-360:ci
          sleep 4
          docker exec test-govasset wget -qO- http://localhost:8080/healthz || exit 1
          echo "✅ Container health check passed (/healthz -> 200 OK)"
          docker stop test-govasset

